version: "3"

services:
  app:
    container_name: exam-backend
    build: .
    restart: always
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=postgresql://kumza007:comeza69eiei@10.10.184.148:7004/mex-db
      - MINIO_ACCESS_KEY_ID=inwzadonaldtrump1975
      - MINIO_SECRET_ACCESS_KEY=monkeydonaldtrumpluffy
      - AMPLIFY_BUCKET=clinic-monkol-examfile
      - ENDPOINT=10.10.184.148
    depends_on:
      - db
      - minio

  db:
    image: postgres:latest
    container_name: exam-db
    restart: always
    environment:
      POSTGRES_DB: "mex-db"
      POSTGRES_USER: "kumza007"
      POSTGRES_PASSWORD: "comeza69eiei"
    ports:
      - "7004:5432"
    volumes:
      - my-db:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: exam-minio
    environment:
      MINIO_ROOT_USER: inwzadonaldtrump1975
      MINIO_ROOT_PASSWORD: monkeydonaldtrumpluffy
      MINIO_BROWSER_REDIRECT_URL: https://minio.exam.clinic.se.cpe.eng.cmu.ac.th/
    ports:
      - "9400:9000" # API
      - "9401:9001" # Console
    volumes:
      - ./minio_storage:/data # Data will be stored here
    command: server --address ":9000" --console-address ":9001" /data
    restart: always

volumes:
  my-db:
